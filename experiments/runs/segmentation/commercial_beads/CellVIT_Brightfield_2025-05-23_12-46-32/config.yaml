data:
  data_type: Brightfield
  dataset_folder_path: /data_ssd2/iscat_data
  fluo_masks_indices:
  - 0
  - 1
  image_size: 256
  multi_class: false
  normalize: zscore
  seg_method: comdet
  train_dataset:
    apply_augmentation: true
    classes:
    - 0
    - 1
    multi_class: false
    normalize: zscore
    num_workers: 3
  valid_dataset:
    apply_augmentation: false
    classes:
    - 0
    - 1
    multi_class: false
    normalize: zscore
    num_workers: 3
  z_chunk_size: 32
logging:
  tensorboard:
    log_dir: experiments/runs/segmentation/commercial_beads
model:
  depth: 12
  embed_dim: 384
  extract_layers:
  - 3
  - 6
  - 9
  - 12
  num_heads: 6
  patch_size: 8
  type: CellVIT
seed: 0
testing: null
training:
  batch_size: 10
  class_weights:
    calculation_method: from_masks
    use: true
  device: cuda:4
  early_stopping:
    enabled: true
    patience: 20
  loss:
    loss_type: tversky
    parameters:
      alpha: 0.4
      beta: 0.6
      gamma: 1.0
      lambda_ce: 0.1
      lambda_dice: 1.0
  num_epochs: 400
  optimizer:
    parameters:
      lr: 0.0005
    type: Adam
  scheduler:
    parameters:
      factor: 0.1
      mode: min
      patience: 8
    type: ReduceLROnPlateau
  train_split_size: 0.7
